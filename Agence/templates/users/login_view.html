{% extends 'base.html' %}

{% block content %}
<div class="container">
    <div class="row mt-5 mb-5 shadow">
        <div class="col-lg-6 shadow p-4">
            <div style="border-bottom: 2px solid rgb(152, 187, 244);">
                <h3>Connexion</h3>
                <p class="text-muted">Connectez-vous à votre compte pour continuer.</p>
                {% if messages %}
                    {% for message in messages %}
                        <div class="alert alert-danger">{{ message }}</div>
                    {% endfor %}
                {% endif %}
            </div>
            <form method="post" action="{% url 'login_view' %}">
                {% csrf_token %}
                <div class="form-group mt-2">
                    <label for="exampleInputEmail1">Nom d'utilisateur</label>
                    <input type="text" class="form-control" id="exampleInputEmail1" name="username" aria-describedby="emailHelp">
                </div>
                <div class="form-group">
                    <div class="d-flex justify-content-between align-items-center">
                        <label for="exampleInputPassword1" class="mb-0">Mot de passe</label>
                        <a href="{% url 'password_reset' %}">Mot de passe oublié ?</a>
                    </div>
                    <input type="password" class="form-control" id="exampleInputPassword1" name="password">
                </div>
                <div class="form-group form-check">
                    <input type="checkbox" class="form-check-input" id="exampleCheck1">
                    <label class="form-check-label" for="exampleCheck1">Se souvenir de moi</label>
                </div>
                <button type="submit" class="btn btn-primary">Connectez-vous</button>
            </form>
        </div>
        <div class="col-lg-6  ">
                <img src="https://dynamic-media-cdn.tripadvisor.com/media/photo-o/1b/c8/65/d8/arnor-de-luxe-hotel-spa.jpg?w=700&h=-1&s=1" alt="" class="img-fluid img-responsive">
        </div>
    </div>
</div>
{% endblock %}
