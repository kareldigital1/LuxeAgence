{% extends 'base.html' %}

{% block content %}
<div class="container py-4" style="width: 50%;">
    <div class="card shadow-sm">
        <div class="card-header d-flex justify-content-between align-items-center">
            <h3 class="mb-0">Les permissions de ce rôle</h3>
        </div>
 <div class="card-body">

            <!-- Titre -->
            <h3 class="mb-3">{{ role.name }}</h3>


            <!-- permissions -->
            <p><strong>Permissions :</strong></p>
            <div class="border p-3 rounded bg-light">
                <ul class="list-unstyled">
                    {% for permission in object.permissions.all %}
                        <li>{{ permission.name }}</li>
                    {% endfor %}
                </ul>
            </div>

            <!-- Boutons -->
            <div class="mt-4">
                <a href="{% url 'gestroles' %}" class="btn btn-secondary">Retour</a>
            </div>

        </div>
    </div>
</div>
{% endblock %}
