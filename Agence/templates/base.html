<!doctype html>
<html lang="en">
  <head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/css/bootstrap.min.css" integrity="sha384-Vkoo8x4CGsO3+Hhxv8T/Q5PaXtkKtu6ug5TOeNV6gBiFeWPGFN9MuhOf23Q9Ifjh" crossorigin="anonymous">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
      /* Couleurs de navbar personnalisées */
      .navbar-custom { background-color: #121212; }
      .navbar-custom .navbar-brand { color: #f1d35d; font-weight: 900; letter-spacing: 0.08em; }
      .navbar-custom .nav-link,
      .navbar-custom .dropdown-item { color: #ffffff; }
      .navbar-custom .nav-link:hover,
      .navbar-custom .dropdown-item:hover { color: #ffffff; background-color: #dcae1b; }
      .navbar-custom .nav-item.active .nav-link {
        color: #f1d35d !important;
        background-color: transparent !important;
        border-radius: 0;
        font-weight: 700;
          }
      /* Style du hamburger menu en responsive */
      .navbar-custom .navbar-toggler {
        border-color: #f1d35d;
      }
      .navbar-custom .navbar-toggler-icon {
        background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' width='30' height='30' viewBox='0 0 30 30'%3e%3cpath stroke='%23f1d35d' stroke-linecap='round' stroke-miterlimit='10' stroke-width='2' d='M4 7h22M4 15h22M4 23h22'/%3e%3c/svg%3e");
      }
        body{
            font-family: 'Times New Roman', Times, serif;
          }
    </style>
    <title>My Luxe Agence</title>
  </head>
  <body>
        <nav class="navbar navbar-expand-lg navbar-custom">
        <a class="navbar-brand" href="{% url 'home' %}">Luxe Agence</a>
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNavDropdown" aria-controls="navbarNavDropdown" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse white" id="navbarNavDropdown">
            <ul class="navbar-nav ml-auto">
            <li class="nav-item active">
                <a class="nav-link" href="{% url 'home' %}">Home<span class="sr-only">(current)</span></a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="#">Hôtels</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="#">A propos</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="#">Contactez-nous</a>
            </li>
            <li class="nav-item dropdown">
                <a class="nav-link dropdown-toggle" href="#" id="navbarDropdownMenuLink" role="button" data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
                    <i class="bi bi-person"></i>
                </a>
                <div class="dropdown-menu dropdown-menu-right dropdown-bg-dark" aria-labelledby="navbarDropdownMenuLink">
                <a class="dropdown-item" href="{% url 'register' %}">S'inscrire</a>
                <a class="dropdown-item" href="{% url 'login_view' %}">Se connecter</a>
                </div>
            </li>
            </ul>
        </div>
        </nav>

    {% block content %}

    {% endblock %}


    <footer class="bg-dark  p-3">
        <p class="text-center text-white">© 2026 Luxe Agence. Tous droits réservés. Développé par KStalker.</p>
    </footer>
    <!-- Optional JavaScript -->
    <!-- jQuery first, then Popper.js, then Bootstrap JS -->
    <script src="https://code.jquery.com/jquery-3.4.1.slim.min.js" integrity="sha384-J6qa4849blE2+poT4WnyKhv5vZF5SrPo0iEjwBvKU7imGFAV0wwj1yYfoRSJoZ+n" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.0/dist/umd/popper.min.js" integrity="sha384-Q6E9RHvbIyZFJoft+2mJbHaEWldlvI9IOYy5n3zV9zzTtmI3UksdQRVvoxMfooAo" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/js/bootstrap.min.js" integrity="sha384-wfSDF2E50Y2D1uUdj0O3uMBJnjuUD4Ih7YwaYd1iqfktj0Uod8GCExl3Og8ifwB6" crossorigin="anonymous"></script>
    <script>
      // Toggle active state de l'onglet en jaune quand on clique
      document.addEventListener('DOMContentLoaded', function () {
        const navLinks = document.querySelectorAll('.navbar-custom .nav-link');
        navLinks.forEach((link) => {
          link.addEventListener('click', function () {
            navLinks.forEach((l) => l.parentElement.classList.remove('active'));
            const parent = this.closest('.nav-item');
            if (parent) parent.classList.add('active');
          });
        });
      });
    </script>
  </body>
</html>
