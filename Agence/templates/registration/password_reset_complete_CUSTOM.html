{% extends 'base.html' %}

{% block content %}
<div class="container mt-5 mb-5" style="width: 50%;">
        <div class="col-lg-6 shadow p-4">
            <div style="border-bottom: 2px solid rgb(152, 187, 244);">
                <h4 class="form-title text-center pb-4">Mot de passe modifié</h4>
                <p class="text-muted">Connectez-vous à votre compte pour continuer.</p>
                {% if messages %}
                    {% for message in messages %}
                        <div class="alert alert-danger">{{ message }}</div>
                    {% endfor %}
                {% endif %}
            </div>
            <div class="alert alert-success text-center">
                Votre mot de passe a été réinitialisé avec succès.
            </div>
            <div class="text-center mt-3">
                <a href="{% url 'login_view' %}" class="btn btn-success">
                    Se connecter
                </a>
            </div>
        </div>
</div>
{% endblock %}
